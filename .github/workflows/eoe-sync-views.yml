# Eyes on Eyecare: copy article view counts (Abacus) into the Webflow CMS field "views" every 5 minutes.
# Repo secret: WEBFLOW_TOKEN (Webflow Site settings > Apps & integrations > API access, CMS: Read and write)
name: EoE - sync article views to Webflow CMS

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub minimum is every 5 minutes (runs can start a few minutes late)
  workflow_dispatch:         # "Run workflow" button for a manual sync

concurrency:
  group: eoe-sync-views
  cancel-in-progress: false

permissions:
  contents: write            # only for the keep-alive commit below

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node eoe-views-sync/sync-views.mjs
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
      # GitHub turns scheduled workflows off after 60 days without commits; touch the repo every ~50 days
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep scheduled workflows alive"
            git push
          fi
